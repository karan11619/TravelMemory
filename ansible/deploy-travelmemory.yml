
---
- name: Deploy TravelMemory application
  hosts: web
  become: true

  vars:
    app_dir: /opt/travelmemory
    node_major_version: "20"
    backend_port: 3001
    mongo_uri: "mongodb://10.0.2.230:27017/travelmemory"
    backend_public_url: ""

  tasks:
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - nginx
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure NodeSource repository
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_major_version }}.x -o /tmp/nodesource_setup.sh
        bash /tmp/nodesource_setup.sh
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js and npm
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Clone TravelMemory repository
      ansible.builtin.git:
        repo: "https://github.com/karan11619/TravelMemory.git"
        dest: "{{ app_dir }}"
        version: HEAD
        force: false
      become_user: ubuntu

    - name: Install backend dependencies
      community.general.npm:
        path: "{{ app_dir }}/backend"
        production: true
      become_user: ubuntu

    - name: Configure backend environment
      ansible.builtin.copy:
        dest: "{{ app_dir }}/backend/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          PORT={{ backend_port }}
          MONGO_URI={{ mongo_uri }}
      notify: Restart TravelMemory backend

    - name: Install PM2 process manager
      community.general.npm:
        name: pm2
        global: true
        state: present

    - name: Check whether backend is already registered in PM2
      ansible.builtin.command: pm2 describe travelmemory-backend
      become_user: ubuntu
      register: pm2_backend_status
      failed_when: false
      changed_when: false

    - name: Start TravelMemory backend with PM2
      ansible.builtin.command:
        argv:
          - pm2
          - start
          - index.js
          - --name
          - travelmemory-backend
      args:
        chdir: "{{ app_dir }}/backend"
      become_user: ubuntu
      when: pm2_backend_status.rc != 0

    - name: Restart existing TravelMemory backend
      ansible.builtin.command:
        argv:
          - pm2
          - restart
          - travelmemory-backend
          - --update-env
      become_user: ubuntu
      when: pm2_backend_status.rc == 0

    - name: Build React frontend for production
      ansible.builtin.shell: |
        npm ci
        npm run build
      args:
        chdir: "{{ app_dir }}/frontend"
      environment:
        REACT_APP_BACKEND_URL: "{{ backend_public_url }}"
      become_user: ubuntu

    - name: Configure Nginx for TravelMemory
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/travelmemory
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              root {{ app_dir }}/frontend/build;
              index index.html;

              location /trip/ {
                  proxy_pass http://127.0.0.1:{{ backend_port }}/trip/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location = /trip {
                  proxy_pass http://127.0.0.1:{{ backend_port }}/trip;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location = /hello {
                  proxy_pass http://127.0.0.1:{{ backend_port }}/hello;
                  proxy_set_header Host $host;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      notify: Restart Nginx

    - name: Enable TravelMemory Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/travelmemory
        dest: /etc/nginx/sites-enabled/travelmemory
        state: link
        force: true
      notify: Restart Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Save PM2 process list
      ansible.builtin.command: pm2 save
      become_user: ubuntu
      changed_when: false

    - name: Configure PM2 startup at boot
      ansible.builtin.command: pm2 startup systemd -u ubuntu --hp /home/ubuntu
      register: pm2_startup
      changed_when: false

    - name: Display PM2 startup instructions
      ansible.builtin.debug:
        var: pm2_startup.stdout_lines

  handlers:
    - name: Restart TravelMemory backend
      ansible.builtin.shell: |
        pm2 restart travelmemory-backend --update-env
      become_user: ubuntu
      failed_when: false

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
